# Compila la app, la firma con TU llave (guardada en los Secrets del repositorio) y publica el APK.
#  - Cada vez que subes cambios a "main": actualiza el APK en Releases -> "Última compilación".
#  - Cuando publicas un Release con etiqueta (ej: v1.0.0): adjunta el APK a ese Release.
name: Compilar APK

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:        # también se puede ejecutar a mano desde la pestaña Actions

permissions:
  contents: write           # necesario para publicar el APK en Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Preparar la llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/dusky-release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/dusky-release.jks" >> "$GITHUB_ENV"
            echo "Llave de firma lista."
          else
            echo "No hay llave en los secretos: se firmará con la llave de pruebas."
          fi

      - name: Compilar APK (release)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Nombrar el APK
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/release/app-release.apk salida/Dusky.apk
          ls -la salida

      - name: Mostrar con qué llave quedó firmado
        continue-on-error: true
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs salida/Dusky.apk

      - name: Guardar el mapa de código (sirve para leer errores)
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Borrar el APK de pruebas viejo de "Última compilación"
        if: github.event_name != 'release'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset latest app-debug.apk --yes

      - name: Publicar en "Última compilación"
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última compilación
          prerelease: true
          body: Compilación automática más reciente, firmada con la llave del proyecto. Descarga Dusky.apk e instálalo en tu celular.
          files: salida/Dusky.apk

      - name: Adjuntar el APK al Release publicado
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: salida/Dusky.apk
